<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bodija Advanced Centre for Rehabilitation (BACR) - a multidisciplinary rehabilitation centre providing specialised, coordinated care for children and adults in Ibadan."
    />
    <meta name="theme-color" content="#534cea" />
    <script>
      // v2 dropped hash routing (#/about). Forward any old hash URL to its
      // path equivalent before React boots, so links shared from the first
      // release keep working. Hash routes are always base-relative, so only
      // the first pathname segment (the repo base) is kept.
      ;(function () {
        var match = location.hash.match(/^#\/(.*)$/)
        if (!match) return
        var root = (location.pathname.match(/^\/[^/]+/) || [''])[0]
        location.replace(root + '/' + match[1] + location.search)
      })()
    </script>
    <meta property="og:title" content="BACR - Rehabilitation, coordinated around you." />
    <meta
      property="og:description"
      content="Specialised, coordinated rehabilitation for children and adults - physical, occupational, communication, developmental and psychological support in Ibadan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://wizdormer-collab.github.io/BACR-Website/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BACR - Rehabilitation, coordinated around you." />
    <meta
      name="twitter:description"
      content="Coordinated, multidisciplinary rehabilitation for children and adults in Ibadan."
    />
    <meta name="twitter:image" content="https://wizdormer-collab.github.io/BACR-Website/og-image.jpg" />
    <!-- Display/body web fonts are self-hosted (no CDN round trip): see src/styles/fonts.css -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>BACR - Bodija Advanced Centre for Rehabilitation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
